name: CI - Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Checkout shared DevOps automation
        uses: actions/checkout@v4
        with:
          repository: christianjmera/devops-automation
          ref: v1.0.0
          path: devops-automation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Execute shared test script
        env:
          TEST_REQUIREMENTS_FILE: requirements-dev.txt
          TEST_PATH: tests
        run: bash devops-automation/scripts/python/run-tests.sh
